[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
# Deployed contracts are effectively immutable (ADR 0005), so a warning that would be a nuisance
# elsewhere is a defect here.
deny = "warnings"
optimizer = true
optimizer_runs = 10_000
via_ir = false
# Named gas snapshots so a change in cost is visible in review rather than discovered on-chain.
gas_reports = ["LicenseToken", "AppManifest", "SignatureChecker"]
# Read access to the repo root, because `PublishVersion` computes composeHash from a file the
# developer points at — which lives wherever they keep it. Scoped to `./test/fixtures` this script
# could not read anything at all, which is how it shipped unable to run.
fs_permissions = [{ access = "read", path = "./" }]
# Local runs are sized to give feedback in seconds; the `ci` profile below is where the depth that
# actually finds things lives. Deliberately not the other way round — a local suite slow enough to
# skip is a suite that gets skipped.
#
# `depth` is also load-bearing for the vacuity guard in `afterInvariant`, which runs per sequence.
#
# This comment used to estimate the flake risk as the chance of the fuzzer never *selecting*
# `upgrade` — (7/8)^depth, ~0.02% at depth 64 — and concluded depth made it a non-issue. That was
# the wrong question, and the suite went on flaking at roughly one run in twelve. The real gap was
# selecting the action and finding nothing to do: `upgrade` and `tryGuards` both need two versions
# on the *particular* manifest picked, publishes spread across several manifests, and both used to
# return silently when the precondition was unmet. Under `fail_on_revert = false` that return is
# indistinguishable from work.
#
# `_ensureTwoVersions` in the handler now establishes the precondition instead, which took 20
# consecutive clean runs. Depth still helps, but it was never what made the guard hold.
#
# **Clear `cache/invariant` when measuring any of this.** Foundry caches a failing sequence and
# replays it every subsequent run, so one flake looks like a permanent failure — the reason
# `script/mutate.sh` deletes it before the baseline, and the reason six "reproductions" of this bug
# were one stale cache entry.
invariant = { runs = 32, depth = 64, fail_on_revert = false }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
number_underscore = "thousands"
quote_style = "double"
sort_imports = true

[profile.ci]
verbosity = 3
fuzz = { runs = 4096 }
invariant = { runs = 256, depth = 128, fail_on_revert = false }
