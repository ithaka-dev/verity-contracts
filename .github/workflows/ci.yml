name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: fmt · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned. `forge fmt` output changes between versions, so an unpinned toolchain formats
          # differently from whatever the developer has and fails `--check` on code they just
          # formatted — which is how this job was red for days. Same reasoning as pinning nixpkgs
          # and pinning image digests: a description that changes because upstream moved is a
          # description of something other than what you have.
          version: v1.7.1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
      # Fuzz and invariant entries encode the run count and profile-dependent medians, so a snapshot
      # taken under one profile can never match the other. CI sets FOUNDRY_PROFILE=ci, which is how
      # this gate came to be failing on a snapshot generated locally. Restricted to the
      # deterministic tests, where a gas change is a real signal rather than a profile artefact.
      - name: gas snapshot is current
        run: |
          forge snapshot --check --no-match-test '(testFuzz_|invariant_)' \
            || (echo "::error::gas snapshot out of date; run: forge snapshot --no-match-test '(testFuzz_|invariant_)'" && exit 1)

  no-raw-ecrecover:
    name: ecrecover is not called directly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ADR 0005 rule 1: signature verification routes through SignatureChecker so the
      # smart-account branch cannot be bypassed. Asserted rather than trusted, because this is the
      # rule most likely to erode quietly — one hurried commit calling ecrecover directly reads as
      # harmless and breaks every app at the mainnet gate.
      # Strips comments and string literals before looking for a call, so the gate can be strict
      # about calls without being wrong about mentions. The previous grep failed the build on a
      # *comment* explaining why the rule exists — and a gate that fires on prose gets weakened by
      # whoever is unblocking the build, which is precisely how the real check gets lost.
      - name: no ecrecover outside the checker
        run: python3 script/check-no-raw-ecrecover.py src

  mutation:
    name: mutation score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      # Coverage counts lines executed and cannot tell an assertion from a bystander. This suite
      # once scored 2 of 12 — `requireValidSignature` could be deleted outright and every test
      # stayed green — while coverage looked healthy throughout. Each mutant is a bug that was found
      # in review here, or one edit from one that was.
      #
      # A surviving mutant fails the build. So does a mutant that cannot be applied, because a
      # mutant silently absent leaves the score looking complete while a behaviour went unchecked.
      # The full suite, not --quick. Quick mode cannot distinguish "reverted for the right reason"
      # from "reverted at all", so it under-reports by one.
      - run: ./script/mutate.sh

  factory-holds-no-state:
    name: AppManifestFactory has no storage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned. `forge fmt` output changes between versions, so an unpinned toolchain formats
          # differently from whatever the developer has and fails `--check` on code they just
          # formatted — which is how this job was red for days. Same reasoning as pinning nixpkgs
          # and pinning image digests: a description that changes because upstream moved is a
          # description of something other than what you have.
          version: v1.7.1
      # ADR 0021 rests on the factory being structurally unable to gate anything. A single mapping
      # would be enough for something downstream to start treating absence from it as meaningful,
      # and publishing an app would quietly require the factory's cooperation — which spec §1
      # forbids. A Solidity test cannot see this: mapping entries live at keccak256(key, slot), so
      # sampling slots passes either way.
      - name: storage layout is empty
        run: |
          forge build --extra-output storageLayout
          LAYOUT=$(forge inspect AppManifestFactory storageLayout --json)
          COUNT=$(echo "$LAYOUT" | python3 -c "import json,sys; print(len(json.load(sys.stdin)['storage']))")
          if [ "$COUNT" != "0" ]; then
            echo "$LAYOUT"
            echo "::error::AppManifestFactory declares $COUNT storage variable(s); see ADR 0021"
            exit 1
          fi
          echo "ok: AppManifestFactory declares no storage"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned. `forge fmt` output changes between versions, so an unpinned toolchain formats
          # differently from whatever the developer has and fails `--check` on code they just
          # formatted — which is how this job was red for days. Same reasoning as pinning nixpkgs
          # and pinning image digests: a description that changes because upstream moved is a
          # description of something other than what you have.
          version: v1.7.1
      # Thresholds live in script/check-coverage.py so they are runnable locally and reviewable as
      # a diff, rather than buried in shell inside a workflow.
      - name: coverage thresholds
        run: |
          forge coverage --report summary --no-match-coverage '(script|test)' > coverage.txt
          cat coverage.txt
          python3 script/check-coverage.py coverage.txt
