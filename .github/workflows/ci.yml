name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: fmt · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
      - name: gas snapshot is current
        run: forge snapshot --check || (echo "::error::gas snapshot out of date; run forge snapshot" && exit 1)

  no-raw-ecrecover:
    name: ecrecover is not called directly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # ADR 0005 rule 1: signature verification routes through SignatureChecker so the
      # smart-account branch cannot be bypassed. Asserted rather than trusted, because this is the
      # rule most likely to erode quietly — one hurried commit calling ecrecover directly reads as
      # harmless and breaks every app at the mainnet gate.
      - name: no ecrecover outside the checker
        run: |
          HITS=$(grep -rn "ecrecover" src/ --include=*.sol | grep -v "src/SignatureChecker.sol" || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::ecrecover called outside SignatureChecker; see ADR 0005"
            exit 1
          fi
          echo "ok: ecrecover appears only in SignatureChecker"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge coverage --report summary
